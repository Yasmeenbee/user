<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"> <!-- Add Thymeleaf namespace -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/styles.css}"> <!-- Corrected CSS path -->
</head>
<body>
<div class="login-container">
    <h2>Login</h2>
    <form action="/login" method="POST" id="loginForm">
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
        </div>
        <button type="submit">Login</button> <!-- Changed type="register" to type="submit" -->
    </form>
    <p>Don't have an account? <a href="register">Register</a></p> <!-- Corrected register link -->
</div>
<script th:src="@{/scripts.js}"></script> <!-- Corrected JavaScript path -->
</body>
</html>
